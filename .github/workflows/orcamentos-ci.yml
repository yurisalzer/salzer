name: Orçamentos — testes

on:
  push:
    paths: ["orcamentos/**", ".github/workflows/orcamentos-ci.yml"]
  pull_request:
    paths: ["orcamentos/**"]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orcamentos
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orcamentos_teste
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orcamentos_teste
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orcamentos_teste
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orcamentos_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orcamentos/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Verificação de tipos
        run: npx tsc --noEmit
      - name: Testes (unitários e integração com PostgreSQL)
        run: npx vitest run
      - name: Build de produção
        run: npx next build
